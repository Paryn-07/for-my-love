<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Our Timeline</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-glow: #ff66b2;
            --secondary-glow: #ff1a8c;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: #000000;
            touch-action: none;
        }

        /* ========================================================
           HEART CANVAS
           ======================================================== */

        #heartCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ========================================================
           UI
           ======================================================== */

        #ui-layer {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;

            padding-bottom: 5vh;

            pointer-events: none;
        }

        .glass-panel {
            background: rgba(255, 10, 110, 0.05);

            border: 1px solid rgba(255, 102, 178, 0.20);

            box-shadow:
                0 0 20px rgba(255, 102, 178, 0.15),
                inset 0 0 10px rgba(255, 102, 178, 0.10);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            border-radius: 24px;

            pointer-events: auto;

            animation: float 6s ease-in-out infinite;
        }

        .time-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.40);

            border: 1px solid rgba(255, 102, 178, 0.30);

            border-radius: 14px;

            flex: 1 1 0;
            min-width: 0;
            padding: 8px 3px;

            box-shadow:
                inset 0 0 10px rgba(255, 102, 178, 0.10);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .time-block:hover {
            transform: translateY(-5px);

            box-shadow:
                0 5px 15px rgba(255, 102, 178, 0.40);
        }

        .time-value {
            font-size: clamp(0.95rem, 6vw, 1.75rem);
            font-weight: 800;

            color: var(--text-color);

            line-height: 1.2;

            white-space: nowrap;

            text-shadow:
                0 0 10px var(--primary-glow),
                0 0 20px var(--secondary-glow);
        }

        .time-label {
            font-size: clamp(0.55rem, 2.6vw, 0.8rem);
            font-weight: 400;

            color: #ffb3d9;

            text-shadow:
                0 0 5px rgba(255, 102, 178, 0.50);

            margin-top: 2px;

            white-space: nowrap;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }
        }

        /* ========================================================
           RESPONSIVE
           ======================================================== */

        @media (min-width: 640px) {

            .time-block {
                min-width: 90px;
                padding: 15px 10px;
            }

            .time-value {
                font-size: 2.5rem;
            }

            .time-label {
                font-size: 1rem;
            }
        }

        @media (min-width: 768px) {

            #ui-layer {
                padding-bottom: 8vh;
            }

            .time-block {
                min-width: 100px;
            }

            .time-value {
                font-size: 3rem;
            }

            .time-label {
                font-size: 1.1rem;
            }

            .glass-panel {
                padding: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- ========================================================
         HEART
         ======================================================== -->

    <canvas id="heartCanvas"></canvas>


    <!-- ========================================================
         TIMER UI
         ======================================================== -->

    <div id="ui-layer" class="w-full h-full flex flex-col items-center">

        <div class="glass-panel w-[95%] sm:w-auto max-w-4xl mx-auto px-4 py-6 sm:px-8 sm:py-8 flex flex-col items-center">

            <div class="flex flex-nowrap justify-center gap-1 sm:gap-3 md:gap-4 w-full">

                <!-- Years -->
                <div class="time-block">
                    <span id="val-years" class="time-value">0</span>
                    <span class="time-label">ปี</span>
                </div>

                <!-- Months -->
                <div class="time-block">
                    <span id="val-months" class="time-value">0</span>
                    <span class="time-label">เดือน</span>
                </div>

                <!-- Days -->
                <div class="time-block">
                    <span id="val-days" class="time-value">0</span>
                    <span class="time-label">วัน</span>
                </div>

                <!-- Hours -->
                <div class="time-block">
                    <span id="val-hours" class="time-value">0</span>
                    <span class="time-label">ชั่วโมง</span>
                </div>

                <!-- Minutes -->
                <div class="time-block">
                    <span id="val-mins" class="time-value">0</span>
                    <span class="time-label">นาที</span>
                </div>

                <!-- Seconds -->
                <div class="time-block">
                    <span id="val-secs" class="time-value">0</span>
                    <span class="time-label">วินาที</span>
                </div>

            </div>

            <p class="mt-6 text-xs sm:text-sm text-pink-200 opacity-70 tracking-widest">
                SINCE 19 APRIL 2022
            </p>

        </div>

    </div>


    <script>

        /* ========================================================
           3D HEART ENGINE
           ======================================================== */

        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d", {
            alpha: true
        });


        /* ========================================================
           VARIABLES
           ======================================================== */

        let points = [];

        let angleY = 0;

        /*
         * เอียงน้อยมาก
         * เพื่อรักษาทรงหัวใจให้เห็นชัด
         */
        let angleX = 0.04;

        /*
         * ใช้เวลาในการคำนวณ animation
         */
        let lastTime = 0;

        /*
         * จำกัด DPR
         *
         * จอมือถือ/จอ Retina บางเครื่องมี DPR = 3 หรือ 4
         * ซึ่งทำให้ canvas หนักโดยไม่จำเป็น
         */
        let dpr = Math.min(
            window.devicePixelRatio || 1,
            1.5
        );


        /* ========================================================
           TEXT SPRITE
           ======================================================== */

        /*
         * แทนที่จะให้ Canvas วาดข้อความ 420 ครั้งทุกเฟรม
         * เราสร้างข้อความเป็นภาพครั้งเดียว
         * แล้วใช้ drawImage() ซ้ำ
         */

        const spriteCanvas =
            document.createElement("canvas");

        const spriteCtx =
            spriteCanvas.getContext("2d");


        function createTextSprite() {

            const fontSize = 16;

            const padding = 12;

            spriteCanvas.width = 180;
            spriteCanvas.height = 55;

            spriteCtx.clearRect(
                0,
                0,
                spriteCanvas.width,
                spriteCanvas.height
            );

            spriteCtx.textAlign = "center";
            spriteCtx.textBaseline = "middle";

            spriteCtx.font =
                `bold ${fontSize}px Kanit, sans-serif`;

            /*
             * ทำ glow แค่ครั้งเดียว
             */
            spriteCtx.shadowBlur = 7;

            spriteCtx.shadowColor =
                "rgba(255, 60, 160, 0.85)";

            spriteCtx.fillStyle =
                "#ff9dcc";

            spriteCtx.fillText(
                "เค้ารักคูมนะ",
                spriteCanvas.width / 2,
                spriteCanvas.height / 2
            );

            /*
             * เพิ่มชั้นข้อความสีขาวบาง ๆ
             */
            spriteCtx.shadowBlur = 0;

            spriteCtx.fillStyle =
                "rgba(255,255,255,0.65)";

            spriteCtx.fillText(
                "เค้ารักคูมนะ",
                spriteCanvas.width / 2,
                spriteCanvas.height / 2
            );
        }


        createTextSprite();


        /* ========================================================
           RESIZE CANVAS
           ======================================================== */

        function resize() {

            dpr = Math.min(
                window.devicePixelRatio || 1,
                1.5
            );

            const width =
                window.innerWidth;

            const height =
                window.innerHeight;

            canvas.width =
                Math.floor(width * dpr);

            canvas.height =
                Math.floor(height * dpr);

            canvas.style.width =
                width + "px";

            canvas.style.height =
                height + "px";

            /*
             * สำคัญ:
             * reset transform ก่อน scale
             */
            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );
        }


        window.addEventListener(
            "resize",
            resize
        );

        resize();


        /* ========================================================
           GENERATE HEART POINTS
           ======================================================== */

        function generateHeartCloud() {

            points = [];

            /*
             * เปลี่ยนมาใช้สมการพาราเมตริกของหัวใจ (parametric heart curve)
             * แทนสมการ implicit เดิม
             *
             * เหตุผล: สมการเดิมใช้ rejection sampling บนก้อนลูกบาศก์
             * ทำให้จุดกระจายแบบสุ่มไม่สม่ำเสมอ บางมุมมองดูเป็นก้อนกลม ๆ
             * ไม่ชัดว่าเป็นรูปหัวใจ โดยเฉพาะบนจอมือถือที่เล็กและอยู่ไกลตา
             *
             * สมการพาราเมตริกนี้วาดเส้นขอบหัวใจได้แม่นตรง 100% ทุกจุด
             * แล้วเติม "เนื้อใน" แบบมีความหนา (พองตรงกลาง บางตรงขอบ)
             * เหมือนหมอนรูปหัวใจ ทำให้หมุนไปมุมไหนก็ยังดูออกว่าเป็นหัวใจ
             * ไม่ใช่แผ่นแบนที่หมุนแล้วบางจนหายไปเป็นเส้น
             *
             * จำนวนจุดยังคงเท่าเดิม (500) เพื่อไม่ให้หนักขึ้น/แลค
             */

            const numPoints = 500;

            const scaleX = 16.5;
            const scaleY = 18;

            /*
             * ความหนาสูงสุดตรงกลางหัวใจ
             */
            const maxThickness = 0.5;

            for (
                let i = 0;
                i < numPoints;
                i++
            ) {

                const t =
                    Math.random() * Math.PI * 2;

                const bx =
                    16 * Math.pow(
                        Math.sin(t),
                        3
                    );

                const by =
                    13 * Math.cos(t) -
                    5 * Math.cos(2 * t) -
                    2 * Math.cos(3 * t) -
                    Math.cos(4 * t);

                let s;

                if (i < numPoints * 0.35) {

                    /*
                     * 35% ของจุดแรก
                     * เกาะอยู่แถบขอบนอกของหัวใจ
                     * เพื่อวาดเส้น outline ให้ชัดเจน
                     * (จุดหยักบนสุด + ปลายแหลมล่าง จะเห็นง่าย)
                     */
                    s =
                        0.80 +
                        Math.random() * 0.20;

                } else {

                    /*
                     * ที่เหลือกระจายเต็มพื้นที่ด้านใน
                     * ใช้ sqrt(random) เพื่อให้ความหนาแน่น
                     * ต่อหน่วยพื้นที่สม่ำเสมอ ไม่กระจุกตรงกลาง
                     */
                    s = Math.sqrt(
                        Math.random()
                    );
                }

                const nx =
                    (s * bx) / scaleX;

                const ny =
                    -(s * by) / scaleY;

                /*
                 * หน้าตัดแบบเลนส์: หนาสุดตรงกลาง
                 * บางลงเรื่อย ๆ จนเป็น 0 ที่ขอบเส้น outline
                 */
                const thickness =
                    maxThickness *
                    Math.sqrt(
                        Math.max(
                            0,
                            1 - s * s
                        )
                    );

                const nz =
                    (Math.random() * 2 - 1) *
                    thickness;

                points.push({

                    origX: nx,

                    origY: ny,

                    origZ: nz

                });
            }
        }


        generateHeartCloud();


        /* ========================================================
           ANIMATE HEART
           ======================================================== */

        function animateHeart(time = 0) {

            requestAnimationFrame(
                animateHeart
            );


            /*
             * Delta time
             *
             * ทำให้ animation ไม่ขึ้นกับ FPS
             */
            const deltaTime =
                Math.min(
                    (time - lastTime) / 1000,
                    0.05
                );

            lastTime = time;


            /* ====================================================
               CLEAR
               ==================================================== */

            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );


            /* ====================================================
               ROTATION
               ==================================================== */

            /*
             * หมุนช้าลง
             *
             * 0.22 rad/sec
             */
            angleY +=
                0.22 * deltaTime;


            /*
             * คำนวณ sin/cos ครั้งเดียว
             * ไม่ใช่ทุกจุด
             */

            const cosX =
                Math.cos(angleX);

            const sinX =
                Math.sin(angleX);

            const cosY =
                Math.cos(angleY);

            const sinY =
                Math.sin(angleY);


            /* ====================================================
               POSITION
               ==================================================== */

            const cx =
                window.innerWidth / 2;


            /*
             * ตำแหน่งหัวใจ
             *
             * 34%
             * อยู่ช่วงบนพอดี
             */
            const cy =
                window.innerHeight * 0.34;


            /* ====================================================
               SIZE
               ==================================================== */

            /*
             * 0.36
             *
             * ใหญ่พอเห็นเป็นหัวใจ
             * แต่ยังไม่ชนขอบ
             */
            const baseSize =
                Math.min(
                    window.innerWidth,
                    window.innerHeight
                ) * 0.36;


            /* ====================================================
               PROJECT POINTS
               ==================================================== */

            const projected =
                new Array(points.length);


            for (
                let i = 0;
                i < points.length;
                i++
            ) {

                const p =
                    points[i];


                /* -----------------------------------------------
                   ROTATE X
                   ----------------------------------------------- */

                const y1 =
                    p.origY * cosX -
                    p.origZ * sinX;


                const z1 =
                    p.origY * sinX +
                    p.origZ * cosX;


                /* -----------------------------------------------
                   ROTATE Y
                   ----------------------------------------------- */

                const x2 =
                    p.origX * cosY -
                    z1 * sinY;


                const z2 =
                    p.origX * sinY +
                    z1 * cosY;


                projected[i] = {

                    x: x2,

                    y: y1,

                    z: z2
                };
            }


            /* ====================================================
               DEPTH SORT
               ==================================================== */

            projected.sort(
                (a, b) => a.z - b.z
            );


            /* ====================================================
               DRAW
               ==================================================== */

            for (
                let i = 0;
                i < projected.length;
                i++
            ) {

                const p =
                    projected[i];


                /* -----------------------------------------------
                   Perspective
                   ----------------------------------------------- */

                const perspective =
                    3.0 /
                    (3.0 + p.z);


                if (
                    perspective <= 0
                ) {
                    continue;
                }


                /* -----------------------------------------------
                   SCREEN POSITION
                   ----------------------------------------------- */

                const screenX =
                    cx +
                    p.x *
                    baseSize *
                    perspective;


                const screenY =
                    cy +
                    p.y *
                    baseSize *
                    perspective;


                /* -----------------------------------------------
                   SIZE
                   ----------------------------------------------- */

                /*
                 * ภาพข้อความเดิมขนาด 180 x 55
                 *
                 * scale เล็กลง
                 * เพื่อให้เกิดเป็น particle
                 */

                const size =
                    0.40 *
                    perspective;


                const drawWidth =
                    180 * size;


                const drawHeight =
                    55 * size;


                /* -----------------------------------------------
                   DEPTH OPACITY
                   ----------------------------------------------- */

                const alpha =
                    Math.max(
                        0.18,
                        Math.min(
                            0.95,
                            0.45 +
                            (p.z + 1.5) * 0.22
                        )
                    );


                ctx.globalAlpha =
                    alpha;


                /*
                 * drawImage เร็วกว่า
                 * fillText + shadowBlur มาก
                 */
                ctx.drawImage(
                    spriteCanvas,
                    screenX -
                        drawWidth / 2,
                    screenY -
                        drawHeight / 2,
                    drawWidth,
                    drawHeight
                );
            }


            /*
             * reset alpha
             */
            ctx.globalAlpha = 1;
        }


        animateHeart();


        /* ========================================================
           RELATIONSHIP TIMER
           ======================================================== */

        function calculateRelationshipTime() {

            /*
             * 19 April 2022
             */
            const startDate =
                new Date(
                    2022,
                    3,
                    19,
                    0,
                    0,
                    0
                );


            const now =
                new Date();


            let years =
                now.getFullYear() -
                startDate.getFullYear();


            let months =
                now.getMonth() -
                startDate.getMonth();


            let days =
                now.getDate() -
                startDate.getDate();


            let hours =
                now.getHours() -
                startDate.getHours();


            let minutes =
                now.getMinutes() -
                startDate.getMinutes();


            let seconds =
                now.getSeconds() -
                startDate.getSeconds();


            /* ====================================================
               BORROW
               ==================================================== */

            if (seconds < 0) {

                seconds += 60;

                minutes--;
            }


            if (minutes < 0) {

                minutes += 60;

                hours--;
            }


            if (hours < 0) {

                hours += 24;

                days--;
            }


            if (days < 0) {

                const previousMonthDate =
                    new Date(
                        now.getFullYear(),
                        now.getMonth(),
                        0
                    );


                days +=
                    previousMonthDate.getDate();


                months--;
            }


            if (months < 0) {

                months += 12;

                years--;
            }


            /* ====================================================
               UPDATE UI
               ==================================================== */

            document.getElementById(
                "val-years"
            ).innerText =
                years;


            document.getElementById(
                "val-months"
            ).innerText =
                months;


            document.getElementById(
                "val-days"
            ).innerText =
                days;


            document.getElementById(
                "val-hours"
            ).innerText =
                hours
                    .toString()
                    .padStart(2, "0");


            document.getElementById(
                "val-mins"
            ).innerText =
                minutes
                    .toString()
                    .padStart(2, "0");


            document.getElementById(
                "val-secs"
            ).innerText =
                seconds
                    .toString()
                    .padStart(2, "0");
        }


        calculateRelationshipTime();


        setInterval(
            calculateRelationshipTime,
            1000
        );

    </script>

</body>
</html>
