<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-glow: #ff66b2;
            --secondary-glow: #ff1a8c;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {

            backdrop-filter: blur(8px);

<body>

    <canvas id="heartCanvas"></canvas>

    <div id="ui-layer" class="w-full h-full flex flex-col items-center">

        <div class="glass-panel w-[95%] sm:w-auto max-w-4xl mx-auto px-4 py-6 sm:px-8 sm:py-8 flex flex-col items-center">

            <div class="flex flex-wrap justify-center gap-2 sm:gap-3 md:gap-4 w-full">

                <div class="time-block">
                    <span id="val-years" class="time-value">0</span>
                    <span class="time-label">ปี</span>
                </div>

                <div class="time-block">
                    <span id="val-months" class="time-value">0</span>
                    <span class="time-label">เดือน</span>
                </div>

                <div class="time-block">
                    <span id="val-days" class="time-value">0</span>
                    <span class="time-label">วัน</span>
                </div>

                <div class="time-block">
                    <span id="val-hours" class="time-value">0</span>
                    <span class="time-label">ชั่วโมง</span>
                </div>

                <div class="time-block">
                    <span id="val-mins" class="time-value">0</span>
                    <span class="time-label">นาที</span>
                </div>

                <div class="time-block">
                    <span id="val-secs" class="time-value">0</span>
                    <span class="time-label">วินาที</span>
                </div>

            </div>

            <p class="mt-6 text-xs sm:text-sm text-pink-200 opacity-70 tracking-widest">
                SINCE 19 APRIL 2022
            </p>

        </div>
    </div>

    <script>
        /* ========================================================
           3D HEART
           ======================================================== */

        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let points = [];

        // หมุนแนวตั้งน้อยลง เพื่อให้เห็นทรงหัวใจชัด
        let angleX = 0.08;
        let angleY = 0;

        let lastTime = 0;

        /* ========================================================
           RESIZE
           ======================================================== */

        function resize() {
            const dpr = window.devicePixelRatio || 1;

            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;

            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resize);
        resize();

        /* ========================================================
           GENERATE HEART
           ======================================================== */

        function generateHeartCloud() {

            points = [];

            const textToRender = "เค้ารักคูมนะ";

            /*
             * เพิ่มจำนวนจุดจาก 500 เป็น 900
             * เพื่อให้ทรงหัวใจเห็นชัดขึ้น
             */
            const numPoints = 900;

            let attempts = 0;

            while (
                points.length < numPoints &&
                attempts < 150000
            ) {
                attempts++;

                let x = (Math.random() - 0.5) * 3.5;
                let y = (Math.random() - 0.5) * 3.5;
                let z = (Math.random() - 0.5) * 3.5;

                /*
                 * 3D Heart Equation
                 */
                let a =
                    x * x +
                    2.25 * y * y +
                    z * z -
                    1;

                let val =
                    a * a * a -
                    (x * x * z * z * z) -
                    (0.1125 * y * y * z * z * z);

                /*
                 * ทำ shell ให้หนาขึ้นเล็กน้อย
                 * จะมองออกว่าเป็นรูปหัวใจมากขึ้น
                 */
                if (val <= 0.0 && val > -0.28) {

                    points.push({
                        origX: x,
                        origY: -z,
                        origZ: y,
                        text: textToRender
                    });
                }
            }
        }

        /* ========================================================
           ANIMATION
           ======================================================== */

        function animateHeart(currentTime = 0) {

            requestAnimationFrame(animateHeart);

            const deltaTime = Math.min(
                (currentTime - lastTime) / 1000,
                0.05
            );

            lastTime = currentTime;

            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );

            /*
             * หมุนช้าลงกว่าเดิม
             * ทำให้ดู smooth และนุ่มกว่า
             */
            angleY += 0.32 * deltaTime;

            /* ====================================================
               POSITION
               ==================================================== */

            const cx = window.innerWidth / 2;

            /*
             * วางหัวใจประมาณ 34% จากด้านบน
             * เพื่อให้ timer ด้านล่างยังมีพื้นที่
             */
            const cy = window.innerHeight * 0.34;

            /* ====================================================
               SIZE
               ==================================================== */

            /*
             * ใหญ่ขึ้นจากเวอร์ชันก่อน
             * แต่ยังไม่ใหญ่เท่าเวอร์ชันแรก
             */
            const baseSize =
                Math.min(
                    window.innerWidth,
                    window.innerHeight
                ) * 0.34;

            /* ====================================================
               3D PROJECTION
               ==================================================== */

            let projected = points.map(p => {

                /* Rotate X */

                const cosX = Math.cos(angleX);
                const sinX = Math.sin(angleX);

                let y1 =
                    p.origY * cosX -
                    p.origZ * sinX;

                let z1 =
                    p.origY * sinX +
                    p.origZ * cosX;

                /* Rotate Y */

                const cosY = Math.cos(angleY);
                const sinY = Math.sin(angleY);

                let x2 =
                    p.origX * cosY -
                    z1 * sinY;

                let z2 =
                    p.origX * sinY +
                    z1 * cosY;

                return {
                    x: x2,
                    y: y1,
                    z: z2,
                    text: p.text
                };
            });

            /* ====================================================
               SORT DEPTH
               ==================================================== */

            projected.sort((a, b) => a.z - b.z);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            /* ====================================================
               DRAW HEART
               ==================================================== */

            projected.forEach(p => {

                const fov = 3.0;

                const perspectiveScale =
                    fov /
                    (fov + p.z);

                if (perspectiveScale < 0) {
                    return;
                }

                const screenX =
                    cx +
                    p.x *
                    baseSize *
                    perspectiveScale;

                const screenY =
                    cy +
                    p.y *
                    baseSize *
                    perspectiveScale;

                /*
                 * ขนาดตัวอักษร
                 */
                const responsiveFontSize =
                    window.innerWidth < 768
                        ? 10
                        : 14;

                const fontSize =
                    responsiveFontSize *
                    perspectiveScale;

                ctx.font =
                    `bold ${fontSize}px 'Kanit', sans-serif`;

                /*
                 * Depth
                 */
                const alpha =
                    Math.max(
                        0.18,
                        Math.min(
                            1,
                            (p.z + 2) / 3
                        )
                    );

                /*
                 * Glow
                 */
                ctx.shadowBlur =
                    9 *
                    perspectiveScale;

                ctx.shadowColor =
                    `rgba(255, 102, 178, ${alpha})`;

                /*
                 * Pink brightness
                 */
                const brightness =
                    Math.floor(
                        155 +
                        alpha * 100
                    );

                const green =
                    Math.max(
                        120,
                        255 - brightness + 100
                    );

                ctx.fillStyle =
                    `rgba(
                        255,
                        ${green},
                        ${brightness},
                        ${alpha}
                    )`;

                ctx.fillText(
                    p.text,
                    screenX,
                    screenY
                );
            });
        }

        /* ========================================================
           START HEART
           ======================================================== */

        generateHeartCloud();
        animateHeart();


        /* ========================================================
           RELATIONSHIP TIMER
           ======================================================== */

        function calculateRelationshipTime() {

            const startDate =
                new Date(
                    2022,
                    3,
                    19,
                    0,
                    0,
                    0
                );

            const now = new Date();

            let years =
                now.getFullYear() -
                startDate.getFullYear();

            let months =
                now.getMonth() -
                startDate.getMonth();

            let days =
                now.getDate() -
                startDate.getDate();

            let hours =
                now.getHours() -
                startDate.getHours();

            let minutes =
                now.getMinutes() -
                startDate.getMinutes();

            let seconds =
                now.getSeconds() -
                startDate.getSeconds();


            /* Borrow seconds */

            if (seconds < 0) {
                seconds += 60;
                minutes--;
            }


            /* Borrow minutes */

            if (minutes < 0) {
                minutes += 60;
                hours--;
            }


            /* Borrow hours */

            if (hours < 0) {
                hours += 24;
                days--;
            }


            /* Borrow days */

            if (days < 0) {

                const previousMonthDate =
                    new Date(
                        now.getFullYear(),
                        now.getMonth(),
                        0
                    );

                days +=
                    previousMonthDate.getDate();

                months--;
            }


            /* Borrow months */

            if (months < 0) {
                months += 12;
                years--;
            }


            /* ====================================================
               UPDATE
               ==================================================== */

            document.getElementById(
                'val-years'
            ).innerText = years;

            document.getElementById(
                'val-months'
            ).innerText = months;

            document.getElementById(
                'val-days'
            ).innerText = days;

            document.getElementById(
                'val-hours'
            ).innerText =
                hours
                    .toString()
                    .padStart(2, '0');

            document.getElementById(
                'val-mins'
            ).innerText =
                minutes
                    .toString()
                    .padStart(2, '0');

            document.getElementById(
                'val-secs'
            ).innerText =
                seconds
                    .toString()
                    .padStart(2, '0');
        }

        calculateRelationshipTime();

        setInterval(
            calculateRelationshipTime,
            1000
        );

    </script>

</body>
</html>
