<html lang="th">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Load Tailwind CSS for responsive layouts -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Load Google Fonts for beautiful Thai typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-glow: #ff66b2;
            --secondary-glow: #ff1a8c;
            --text-color: #ffffff;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: #000000;
            margin: 0;
            padding: 0;
            overflow: hidden;

        /* Canvas for 3D graphics */
        #heartCanvas {
            position: absolute;
            top: 0;

            z-index: 1;
            pointer-events: none;
        }

        /* Overlay UI Container */

            backdrop-filter: blur(8px);

<body>

    <!-- 3D Heart Canvas -->
    <canvas id="heartCanvas"></canvas>

    <!-- UI Overlay for Text and Timer -->
    <div id="ui-layer" class="w-full h-full flex flex-col items-center">

        <!-- Timer Container -->
        <div class="glass-panel w-[95%] sm:w-auto max-w-4xl mx-auto px-4 py-6 sm:px-8 sm:py-8 flex flex-col items-center">

            <div class="flex flex-wrap justify-center gap-2 sm:gap-3 md:gap-4 w-full">

                <!-- Years -->
                <div class="time-block">
                    <span id="val-years" class="time-value">0</span>
                    <span class="time-label">ปี</span>
                </div>

                <!-- Months -->
                <div class="time-block">
                    <span id="val-months" class="time-value">0</span>
                    <span class="time-label">เดือน</span>
                </div>

                <!-- Days -->
                <div class="time-block">
                    <span id="val-days" class="time-value">0</span>
                    <span class="time-label">วัน</span>
                </div>

                <!-- Hours -->
                <div class="time-block">
                    <span id="val-hours" class="time-value">0</span>
                    <span class="time-label">ชั่วโมง</span>
                </div>

                <!-- Minutes -->
                <div class="time-block">
                    <span id="val-mins" class="time-value">0</span>
                    <span class="time-label">นาที</span>
                </div>

                <!-- Seconds -->
                <div class="time-block">
                    <span id="val-secs" class="time-value">0</span>
                    <span class="time-label">วินาที</span>
                </div>

            </div>

            <p class="mt-6 text-xs sm:text-sm text-pink-200 opacity-70 tracking-widest">
                SINCE 19 APRIL 2022
            </p>

        </div>
    </div>

    <script>
        /* ========================================================
           3D HEART CANVAS LOGIC
           ======================================================== */

        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let points = [];

        // Rotation values
        let angleY = 0;
        let angleX = 0.2;

        // Used to make animation FPS-independent
        let lastTime = 0;

        /* ========================================================
           CANVAS RESIZE
           ======================================================== */

        function resize() {
            const dpr = window.devicePixelRatio || 1;

            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;

            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';

            /*
             * Reset transform first.
             * Prevents ctx.scale() from stacking every time
             * the browser resizes the canvas.
             */
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resize);
        resize();

        /* ========================================================
           GENERATE 3D HEART
           ======================================================== */

        function generateHeartCloud() {
            points = [];

            const textToRender = "เค้ารักคูมนะ";

            // Number of particles
            const numPoints = 500;

            let attempts = 0;

            while (points.length < numPoints && attempts < 100000) {

                attempts++;

                // Random coordinates
                let x = (Math.random() - 0.5) * 3.5;
                let y = (Math.random() - 0.5) * 3.5;
                let z = (Math.random() - 0.5) * 3.5;

                // 3D Heart Equation
                let a = x * x + 2.25 * y * y + z * z - 1;

                let val =
                    a * a * a
                    - (x * x * z * z * z)
                    - (0.1125 * y * y * z * z * z);

                /*
                 * Keep points slightly inside the heart surface
                 * to create the hollow 3D-shell appearance.
                 */
                if (val <= 0.0 && val > -0.2) {

                    points.push({
                        origX: x,
                        origY: -z,
                        origZ: y,
                        text: textToRender
                    });
                }
            }
        }

        /* ========================================================
           HEART ANIMATION
           ======================================================== */

        function animateHeart(currentTime = 0) {

            requestAnimationFrame(animateHeart);

            /*
             * Calculate time difference between frames.
             * This makes the rotation speed independent of FPS.
             */
            const deltaTime = Math.min(
                (currentTime - lastTime) / 1000,
                0.05
            );

            lastTime = currentTime;

            // Clear canvas
            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );

            /*
             * Smooth rotation.
             *
             * Old:
             * angleY += 0.006;
             *
             * New:
             * Uses actual elapsed time instead of frame count.
             */
            angleY += 0.45 * deltaTime;

            /* ====================================================
               POSITION
               ==================================================== */

            // Horizontal center
            let cx = window.innerWidth / 2;

            /*
             * Heart center position.
             *
             * 0.38 = slightly above the center,
             * leaving enough room for the timer below.
             */
            let cy = window.innerHeight * 0.38;

            /* ====================================================
               SIZE
               ==================================================== */

            /*
             * Smaller than the previous 0.45.
             *
             * This prevents the heart from reaching
             * too close to the edge of smaller screens.
             */
            let baseSize =
                Math.min(
                    window.innerWidth,
                    window.innerHeight
                ) * 0.30;

            /* ====================================================
               3D TRANSFORMATION
               ==================================================== */

            let projected = points.map(p => {

                /* ----------------------------------------------
                   Rotate around X-axis
                   ---------------------------------------------- */

                let y1 =
                    p.origY * Math.cos(angleX)
                    -
                    p.origZ * Math.sin(angleX);

                let z1 =
                    p.origY * Math.sin(angleX)
                    +
                    p.origZ * Math.cos(angleX);

                /* ----------------------------------------------
                   Rotate around Y-axis
                   ---------------------------------------------- */

                let x2 =
                    p.origX * Math.cos(angleY)
                    -
                    z1 * Math.sin(angleY);

                let z2 =
                    p.origX * Math.sin(angleY)
                    +
                    z1 * Math.cos(angleY);

                let y2 = y1;

                return {
                    x: x2,
                    y: y2,
                    z: z2,
                    text: p.text
                };
            });

            /* ====================================================
               PAINTER'S ALGORITHM
               ==================================================== */

            projected.sort((a, b) => a.z - b.z);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            /* ====================================================
               DRAW PARTICLES
               ==================================================== */

            projected.forEach(p => {

                /* ----------------------------------------------
                   Perspective
                   ---------------------------------------------- */

                let fov = 3.0;

                let perspectiveScale =
                    fov / (fov + p.z);

                if (perspectiveScale < 0) {
                    return;
                }

                /* ----------------------------------------------
                   Screen Position
                   ---------------------------------------------- */

                let screenX =
                    cx +
                    p.x *
                    baseSize *
                    perspectiveScale;

                let screenY =
                    cy +
                    p.y *
                    baseSize *
                    perspectiveScale;

                /* ----------------------------------------------
                   Font Size
                   ---------------------------------------------- */

                let responsiveFontSize =
                    window.innerWidth < 768
                        ? 9
                        : 13;

                let fontSize =
                    responsiveFontSize *
                    perspectiveScale;

                ctx.font =
                    `bold ${fontSize}px 'Kanit', sans-serif`;

                /* ----------------------------------------------
                   Depth Alpha
                   ---------------------------------------------- */

                let alpha =
                    Math.max(
                        0.15,
                        Math.min(
                            1,
                            (p.z + 2) / 3
                        )
                    );

                /* ----------------------------------------------
                   Glow
                   ---------------------------------------------- */

                ctx.shadowBlur =
                    8 * perspectiveScale;

                ctx.shadowColor =
                    `rgba(255, 102, 178, ${alpha})`;

                /* ----------------------------------------------
                   Pink Brightness
                   ---------------------------------------------- */

                let brightness =
                    Math.floor(
                        150 +
                        (alpha * 105)
                    );

                ctx.fillStyle =
                    `rgba(
                        255,
                        ${255 - brightness + 100},
                        ${brightness},
                        ${alpha}
                    )`;

                /* ----------------------------------------------
                   Draw text
                   ---------------------------------------------- */

                ctx.fillText(
                    p.text,
                    screenX,
                    screenY
                );
            });
        }

        /* ========================================================
           INITIALIZE HEART
           ======================================================== */

        generateHeartCloud();
        animateHeart();

        /* ========================================================
           RELATIONSHIP TIMER LOGIC
           ======================================================== */

        function calculateRelationshipTime() {

            /*
             * Start Date:
             * April 19, 2022, 00:00:00
             *
             * JavaScript month is 0-indexed:
             * January = 0
             * April = 3
             */
            const startDate =
                new Date(
                    2022,
                    3,
                    19,
                    0,
                    0,
                    0
                );

            const now = new Date();

            /* ----------------------------------------------------
               Calculate differences
               ---------------------------------------------------- */

            let years =
                now.getFullYear()
                -
                startDate.getFullYear();

            let months =
                now.getMonth()
                -
                startDate.getMonth();

            let days =
                now.getDate()
                -
                startDate.getDate();

            let hours =
                now.getHours()
                -
                startDate.getHours();

            let minutes =
                now.getMinutes()
                -
                startDate.getMinutes();

            let seconds =
                now.getSeconds()
                -
                startDate.getSeconds();

            /* ----------------------------------------------------
               Borrow seconds
               ---------------------------------------------------- */

            if (seconds < 0) {

                seconds += 60;
                minutes--;
            }

            /* ----------------------------------------------------
               Borrow minutes
               ---------------------------------------------------- */

            if (minutes < 0) {

                minutes += 60;
                hours--;
            }

            /* ----------------------------------------------------
               Borrow hours
               ---------------------------------------------------- */

            if (hours < 0) {

                hours += 24;
                days--;
            }

            /* ----------------------------------------------------
               Borrow days
               ---------------------------------------------------- */

            if (days < 0) {

                /*
                 * Get the number of days in the previous month.
                 */
                let previousMonthDate =
                    new Date(
                        now.getFullYear(),
                        now.getMonth(),
                        0
                    );

                days +=
                    previousMonthDate.getDate();

                months--;
            }

            /* ----------------------------------------------------
               Borrow months
               ---------------------------------------------------- */

            if (months < 0) {

                months += 12;
                years--;
            }

            /* ====================================================
               UPDATE HTML
               ==================================================== */

            document.getElementById(
                'val-years'
            ).innerText = years;

            document.getElementById(
                'val-months'
            ).innerText = months;

            document.getElementById(
                'val-days'
            ).innerText = days;

            /* ----------------------------------------------------
               Add leading zeros
               ---------------------------------------------------- */

            document.getElementById(
                'val-hours'
            ).innerText =
                hours
                    .toString()
                    .padStart(2, '0');

            document.getElementById(
                'val-mins'
            ).innerText =
                minutes
                    .toString()
                    .padStart(2, '0');

            document.getElementById(
                'val-secs'
            ).innerText =
                seconds
                    .toString()
                    .padStart(2, '0');
        }

        /* ========================================================
           START TIMER
           ======================================================== */

        calculateRelationshipTime();

        setInterval(
            calculateRelationshipTime,
            1000
        );

    </script>

</body>
</html>
